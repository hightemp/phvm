name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: make lint

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: make govulncheck

  security:
    name: Source security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        run: make security-baseline

      - name: Preserve source security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security
          path: reports/gosec.json

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [minimum, current]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.go == 'minimum'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up current stable Go
        if: matrix.go == 'current'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: go test --% -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test release automation
        if: matrix.os == 'ubuntu-latest'
        run: make test-release

      - name: Test installers
        run: python -B -m unittest discover -s scripts/tests -p test_installers.py -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

  release-check:
    name: Release preflight and snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release-check
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

  archive-smoke:
    name: Archive smoke on ${{ matrix.os }}
    needs: release-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release-snapshot
          path: dist
      - run: python scripts/check_release_artifacts.py --dist dist

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./cmd/phvm

      - name: Verify binary
        run: ./phvm version
        if: matrix.os != 'windows-latest'

      - name: Verify binary (Windows)
        run: .\phvm.exe version
        if: matrix.os == 'windows-latest'
