name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate tag and release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py --tag "$RELEASE_TAG"
      - run: make release-check
      - uses: actions/upload-artifact@v4
        with:
          name: checked-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      - name: Preserve source security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security
          path: reports/gosec.json

  archive-smoke:
    name: Native archive smoke on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: checked-release
          path: dist
      - run: python scripts/check_release_artifacts.py --dist dist

  publish:
    name: Publish validated version
    needs: [preflight, archive-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Recheck tag identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Read pinned GoReleaser version
        id: tools
        run: echo "goreleaser=$(python3 scripts/tool_version.py goreleaser)" >> "$GITHUB_OUTPUT"
      - name: Run pinned GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
